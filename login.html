<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FenLab girişi</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1630;color:#fff;font-family:sans-serif}
.card{background:#12193a;border:2px solid #4b6cff;border-radius:26px;padding:34px 40px;max-width:440px;text-align:center}
button{font-size:21px;padding:14px 26px;border:0;border-radius:16px;background:#22a05a;color:#fff;cursor:pointer}
#msg{opacity:.9;margin:14px 0 22px}</style></head>
<body><div class="card"><h1 style="margin:0">FenLab</h1>
<p id="msg">Google ile giriş yap. İlerlemen buluta kaydedilsin, başka cihazda kaldığın yerden devam et.</p>
<button id="go">Google ile giriş yap</button></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
const auth = getAuth(initializeApp({ apiKey: "AIzaSyB6QqjuLW1gFZsKtAPVpiX9XAFQXponRE8", authDomain: "fen-lab-a58d7.firebaseapp.com", projectId: "fen-lab-a58d7", storageBucket: "fen-lab-a58d7.firebasestorage.app", messagingSenderId: "36295199033", appId: "1:36295199033:web:01f22d04702dae242cc0e8" }));
const q = new URLSearchParams(location.search);
const port = q.get('port'), state = q.get('state') || '';
const msg = document.getElementById('msg');
if (!/^\d{2,5}$/.test(port || '')) { msg.textContent = 'Bu sayfa FenLab uygulamasından açılmalı.'; document.getElementById('go').style.display = 'none'; }
document.getElementById('go').onclick = async () => {
  try {
    const r = await signInWithPopup(auth, new GoogleAuthProvider()); const u = r.user;
    const data = { idToken: await u.getIdToken(), refreshToken: u.refreshToken, uid: u.uid, email: u.email || '', name: u.displayName || '', state };
    msg.textContent = 'Giriş tamam, FenLab\'e dönülüyor...';
    location.href = 'http://127.0.0.1:' + port + '/cb?d=' + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(data)))));
  } catch (e) { msg.textContent = 'Giriş başarısız: ' + (e.code || e); }
};
</script></body></html>
