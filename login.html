<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FenLab girişi</title><link rel="icon" href="favicon.ico">
    <style id="fenlab-shell">
      :root { --fen-bg: #0f1630; --fen-card: #141c4a; --fen-raised: #1c2660; --fen-tx: #eef1ff; --fen-tx2: #b9c6ff; --fen-mut: #8e9bd6;
        --fen-line: rgba(238,241,255,.12); --fen-acc: #35d9ff; --fen-go: #188a49; --fen-go-h: #1d9d54; --fen-ease: cubic-bezier(.22,1,.36,1);
        --fen-font: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif; color-scheme: dark; }
      ::selection { background: rgba(53,217,255,.35); color: #fff; }
      .fen-ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
      .fen-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 12px; border: 0;
        font: 600 17px/1 var(--fen-font); color: #fff; background: var(--fen-go); cursor: pointer; text-decoration: none; transition: background-color .15s var(--fen-ease), transform .1s var(--fen-ease); }
      .fen-btn:hover { background: var(--fen-go-h); } .fen-btn:active { transform: scale(.98); }
      .fen-btn[disabled] { opacity: .6; cursor: progress; }
      .fen-btn.alt { background: var(--fen-raised); color: var(--fen-tx); box-shadow: inset 0 0 0 1px var(--fen-line); } .fen-btn.alt:hover { background: #24307a; }
      .fen-link { background: none; border: 0; padding: 8px; font: 400 15px var(--fen-font); color: var(--fen-tx2); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
      .fen-link:hover { color: var(--fen-tx); }
      .fen-btn:focus-visible, .fen-link:focus-visible { outline: 2px solid var(--fen-acc); outline-offset: 3px; }
      .fen-card { width: min(440px, calc(100vw - 32px)); padding: 32px; border-radius: 20px; background: var(--fen-card); border: 1px solid var(--fen-line);
        box-shadow: 0 24px 64px rgba(0,0,0,.45); color: var(--fen-tx); font-family: var(--fen-font); text-align: center; }
      .fen-card h2 { margin: 0 0 8px; font: 600 24px/1.25 var(--fen-font); }
      .fen-card p { margin: 0 0 24px; font-size: 16px; line-height: 1.5; color: var(--fen-tx2); }
      .fen-card .fen-row { display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .fen-card .fen-small { margin: 16px 0 0; font-size: 14px; }
      .fen-card .fen-small a { color: var(--fen-tx2); text-underline-offset: 3px; }
      .fen-card .fen-detail { margin: 0 0 24px; padding: 12px; border-radius: 10px; background: rgba(0,0,0,.25); font: 13px/1.45 ui-monospace, Consolas, monospace; color: var(--fen-mut); text-align: left; overflow-wrap: anywhere; max-height: 120px; overflow: auto; }
      .fen-mark { display: grid; place-items: center; width: 48px; height: 48px; margin: 0 auto 16px; border-radius: 14px; background: var(--fen-raised); color: var(--fen-acc); }
      .fen-mark .fen-ico { width: 24px; height: 24px; }
      .fen-overlay { position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(5,8,25,.78); animation: fenFade .2s var(--fen-ease) both; }
      .fen-overlay .fen-card { animation: fenRiseIn .25s var(--fen-ease) both; }
      @keyframes fenFade { from { opacity: 0 } } @keyframes fenRiseIn { from { opacity: 0; transform: translateY(8px) } }
      #fen-rotate { display: none; }
      @media (orientation: portrait) and (max-width: 900px) { #fen-rotate { display: flex; position: fixed; inset: 0; z-index: 99998; align-items: center; justify-content: center; padding: 24px; background: var(--fen-bg); } }
      #fen-error { display: none; } #fen-error.on { display: flex; }
      #fen-toast { position: fixed; left: 50%; top: 16px; z-index: 99997; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; width: min(520px, calc(100vw - 32px)); pointer-events: none; }
      #fen-toast div { padding: 12px 16px; border-radius: 12px; background: var(--fen-card); border: 1px solid var(--fen-line); box-shadow: 0 12px 32px rgba(0,0,0,.4); color: var(--fen-tx); font: 15px/1.4 var(--fen-font); animation: fenRiseIn .2s var(--fen-ease) both; }
      @media (prefers-reduced-motion: reduce) { .fen-overlay, .fen-overlay .fen-card, #fen-toast div { animation: none; } }
    </style>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:var(--fen-bg)}
.fen-card img{display:block;width:56px;height:56px;margin:0 auto 16px;border-radius:14px}</style></head>
<body><main class="fen-card"><img src="icon-192.png" alt=""><h2>FenLab'e giriş</h2>
<p id="msg" role="status" aria-live="polite">Google ile giriş yap. İlerlemen buluta kaydedilir, başka cihazda kaldığın yerden devam edersin.</p>
<div class="fen-row"><button class="fen-btn" id="go" type="button">Google ile giriş yap</button></div>
<p class="fen-small"><a href="legal.html">Gizlilik ve telif</a></p></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
const auth = getAuth(initializeApp({ apiKey: "AIzaSyB6QqjuLW1gFZsKtAPVpiX9XAFQXponRE8", authDomain: "fen-lab-a58d7.firebaseapp.com", projectId: "fen-lab-a58d7", storageBucket: "fen-lab-a58d7.firebasestorage.app", messagingSenderId: "36295199033", appId: "1:36295199033:web:01f22d04702dae242cc0e8" }));
const q = new URLSearchParams(location.search);
const port = q.get('port'), state = q.get('state') || '';
const msg = document.getElementById('msg');
if (!/^\d{2,5}$/.test(port || '')) { msg.textContent = 'Bu sayfa FenLab uygulamasından açılmalı.'; document.getElementById('go').style.display = 'none'; }
const go = document.getElementById('go');
go.onclick = async () => {
  go.disabled = true; go.textContent = 'Google penceresi açık...';
  try {
    const r = await signInWithPopup(auth, new GoogleAuthProvider()); const u = r.user;
    const data = { idToken: await u.getIdToken(), refreshToken: u.refreshToken, uid: u.uid, email: u.email || '', name: u.displayName || '', state };
    msg.textContent = 'Giriş tamam, FenLab\'e dönülüyor...';
    location.href = 'http://127.0.0.1:' + port + '/cb?d=' + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(data)))));
  } catch (e) {
    const c = e.code || String(e);
    msg.textContent = c === 'auth/popup-closed-by-user' ? 'Google penceresi kapatıldı. Tekrar dene.'
      : c === 'auth/popup-blocked' ? 'Tarayıcı açılır pencereyi engelledi. Adres çubuğundan izin verip tekrar dene.'
      : 'Giriş yapılamadı (' + c + '). İnternet bağlantını kontrol edip tekrar dene.';
    go.disabled = false; go.textContent = 'Google ile giriş yap';
  }
};
</script></body></html>
