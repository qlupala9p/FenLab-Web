<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>FenLab</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f1630">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
      html, body { margin: 0; height: 100%; background: #0f1630; overflow: hidden; }
      #unity-container, #unity-container.unity-desktop { position: fixed !important; left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; transform: none !important; }
      #unity-fullscreen-container { width: 100% !important; height: 100% !important; }
      #unity-canvas { width: 100% !important; height: 100% !important; background: #0f1630; }
      #unity-footer { display: none !important; }
    </style>
      <style id="fenlab-nav-guard">html, body, #unity-canvas { overscroll-behavior: none; touch-action: none; }</style>
    <script>
      /* fenlab-nav-guard */
      history.pushState({ fenlab: 1 }, '', location.href);
      window.addEventListener('popstate', function () { history.pushState({ fenlab: 1 }, '', location.href); });
      window.addEventListener('wheel', function (e) { if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) e.preventDefault(); }, { passive: false });
      window.addEventListener('keydown', function (e) { if (e.key === 'Backspace' && !/input|textarea/i.test((e.target || {}).tagName || '')) e.preventDefault(); });
    </script>
      <script type="module" id="fenlab-auth">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
      import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
      const auth = getAuth(initializeApp({ apiKey: "AIzaSyB6QqjuLW1gFZsKtAPVpiX9XAFQXponRE8", authDomain: "fen-lab-a58d7.firebaseapp.com", projectId: "fen-lab-a58d7", storageBucket: "fen-lab-a58d7.firebasestorage.app", messagingSenderId: "36295199033", appId: "1:36295199033:web:01f22d04702dae242cc0e8" }));
      window.__fenAuthResult = "";
      function done(o) { window.__fenAuthResult = JSON.stringify(o); const d = document.getElementById('fen-auth-ov'); if (d) d.remove(); }
      window.fenAuthStart = function () {
        if (document.getElementById('fen-auth-ov')) return;
        const d = document.createElement('div'); d.id = 'fen-auth-ov';
        d.style.cssText = 'position:fixed;inset:0;background:rgba(5,8,25,.78);display:flex;align-items:center;justify-content:center;z-index:99999;font-family:sans-serif';
        d.innerHTML = '<div style="background:#12193a;color:#fff;padding:28px 34px;border-radius:24px;max-width:420px;text-align:center;border:2px solid #4b6cff"><h2 style="margin:0 0 8px">FenLab hesabı</h2><p style="opacity:.85;margin:0 0 18px">İlerlemen buluta kaydedilsin diye Google ile giriş yap.</p><button id="fen-go" style="font-size:20px;padding:12px 22px;border:0;border-radius:14px;background:#22a05a;color:#fff;cursor:pointer">Google ile devam et</button><br><button id="fen-no" style="margin-top:14px;background:none;border:0;color:#9db0ff;cursor:pointer;font-size:16px">İptal</button></div>';
        document.body.appendChild(d);
        document.getElementById('fen-no').onclick = () => done({ error: 'cancelled' });
        document.getElementById('fen-go').onclick = async () => {
          try { const r = await signInWithPopup(auth, new GoogleAuthProvider()); const u = r.user;
            done({ idToken: await u.getIdToken(), refreshToken: u.refreshToken, uid: u.uid, email: u.email || '', name: u.displayName || '' });
          } catch (e) { done({ error: e.code || String(e) }); }
        };
      };
    </script>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">FenLab</div>
      </div>
    </div>
    <script>
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data",
        frameworkUrl: buildUrl + "/WebGL.framework.js",
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",

        // If you have a custom web site structure, or want to place multiple Unity build instances on the same page,
        // you can pass fullscreenElementID: "my-unity-fullscreen-container-id", in this configuration field to
        // explicitly point to the element tree root that is displayed in fullscreen mode.
        fullscreenElementID: "unity-fullscreen-container",

        companyName: "FenLab",
        productName: "FenLab",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas container in a window that can be maximized to fullscreen:
        fullscreenContainer.style.width = "960px";
        fullscreenContainer.style.height = "600px";
      }


      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((unityInstance) => {
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
      <script>
      if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js')); }
    </script>
  </body>
</html>
