    <script>

      <style id="fenlab-rotate">#fen-rotate{display:none}@media (orientation:portrait) and (max-width:900px){#fen-rotate{display:flex;position:fixed;inset:0;z-index:99998;background:#0f1630;color:#fff;align-items:center;justify-content:center;flex-direction:column;font-family:sans-serif;text-align:center;padding:30px}#fen-rotate div{font-size:64px;margin-bottom:12px}}</style>
      <script type="module" id="fenlab-auth">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
      import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
      const auth = getAuth(initializeApp({ apiKey: "AIzaSyB6QqjuLW1gFZsKtAPVpiX9XAFQXponRE8", authDomain: "fen-lab-a58d7.firebaseapp.com", projectId: "fen-lab-a58d7", storageBucket: "fen-lab-a58d7.firebasestorage.app", messagingSenderId: "36295199033", appId: "1:36295199033:web:01f22d04702dae242cc0e8" }));
      window.__fenAuthResult = "";
      function done(o) { window.__fenAuthResult = JSON.stringify(o); const d = document.getElementById('fen-auth-ov'); if (d) d.remove(); }
      window.fenAuthStart = function () {
        if (document.getElementById('fen-auth-ov')) return;
        const d = document.createElement('div'); d.id = 'fen-auth-ov';
        d.style.cssText = 'position:fixed;inset:0;background:rgba(5,8,25,.78);display:flex;align-items:center;justify-content:center;z-index:99999;font-family:sans-serif';
        d.innerHTML = '<div style="background:#12193a;color:#fff;padding:28px 34px;border-radius:24px;max-width:420px;text-align:center;border:2px solid #4b6cff"><h2 style="margin:0 0 8px">FenLab hesabı</h2><p style="opacity:.85;margin:0 0 18px">İlerlemen buluta kaydedilsin diye Google ile giriş yap.</p><button id="fen-go" style="font-size:20px;padding:12px 22px;border:0;border-radius:14px;background:#22a05a;color:#fff;cursor:pointer">Google ile devam et</button><br><button id="fen-no" style="margin-top:14px;background:none;border:0;color:#9db0ff;cursor:pointer;font-size:16px">İptal</button><br><a href="legal.html" target="_blank" style="color:#9db0ff;font-size:14px">Gizlilik ve telif</a></div>';
        document.body.appendChild(d);
        document.getElementById('fen-no').onclick = () => done({ error: 'cancelled' });
        document.getElementById('fen-go').onclick = async () => {
          try { const r = await signInWithPopup(auth, new GoogleAuthProvider()); const u = r.user;
            done({ idToken: await u.getIdToken(), refreshToken: u.refreshToken, uid: u.uid, email: u.email || '', name: u.displayName || '' });
          } catch (e) { done({ error: e.code || String(e) }); }
        };
      };
    </script>
      <style id="fenlab-loader">
      #unity-loading-container { display: block; background: radial-gradient(ellipse at 50% 38%, #26358f 0%, #141c4a 45%, #0a0f26 100%); backdrop-filter: none; overflow: hidden; z-index: 5; }
      #unity-loading-bar { width: min(440px, 82vw); text-align: center; z-index: 2; }
      #unity-logo { width: min(260px, 36.5vh, 52vw); height: min(272px, 38vh, 54vw); margin: 0 auto; animation: fenFloat 3.2s ease-in-out infinite; filter: drop-shadow(0 0 28px rgba(53,217,255,.45)); }
      #unity-progress-bar-empty { width: 100%; height: 16px; margin: 22px 0 0; border-radius: 999px; background: rgba(255,255,255,.12); background-image: none; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.10); }
      #unity-progress-bar-full { width: 0%; height: 100%; margin: 0; border-radius: 999px; background: linear-gradient(90deg, #35d9ff, #9a5cf0, #3ed07a, #35d9ff); background-size: 300% 100%; animation: fenShimmer 2.4s linear infinite; transition: width .3s ease-out; box-shadow: 0 0 16px rgba(53,217,255,.7); }
      #fen-load-pct { margin-top: 12px; font: 700 22px 'Segoe UI', Arial, sans-serif; color: #fff; letter-spacing: .5px; }
      #fen-load-tip { margin-top: 10px; min-height: 44px; font: 500 16px 'Segoe UI', Arial, sans-serif; color: #b9c6ff; line-height: 1.35; transition: opacity .4s; }
      .fen-bub { position: absolute; bottom: -60px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.55), rgba(53,217,255,.18) 60%, rgba(154,92,240,.10)); animation: fenRise linear infinite; z-index: 1; }
      @keyframes fenFloat { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
      @keyframes fenShimmer { 0% { background-position: 0% 0 } 100% { background-position: 300% 0 } }
      @keyframes fenRise { 0% { transform: translateY(0) scale(.7); opacity: 0 } 15% { opacity: .9 } 100% { transform: translateY(-115vh) scale(1.1); opacity: 0 } }
    </style>
      <script id="fenlab-loader-js">
      (function () {
        var tips = ["Hata yapmaktan korkma, sonucunu gör.", "Kimya Laboratuvarı'nda arama çubuğuna beher ya da su yaz.", "Google ile giriş yaparsan ilerlemen buluta kaydedilir.", "Konu Anlatımı'nda sınav tarihlerini ve üniteleri filtreleyebilirsin.", "Soru çöz ve görev yap, XP ile avatarına yeni kıyafetler al.", "Tab tuşu fareyle etrafa bakmayı açıp kapatır.", "İlk açılış birkaç saniye sürebilir, sonraki açılışlar daha hızlıdır."];
        var tipEl, pctEl, ti = Math.floor(Math.random() * tips.length);
        function showTip() { if (!tipEl) return; tipEl.style.opacity = 0; setTimeout(function () { tipEl.textContent = tips[ti++ % tips.length]; tipEl.style.opacity = 1; }, 350); }
        window.fenLoadPct = function (p) { if (pctEl) pctEl.textContent = "%" + Math.round(p * 100); };
        window.addEventListener("DOMContentLoaded", function () {
          tipEl = document.getElementById("fen-load-tip"); pctEl = document.getElementById("fen-load-pct");
          showTip(); setInterval(showTip, 3200);
          var c = document.getElementById("unity-loading-container");
          for (var i = 0; i < 14; i++) {
            var b = document.createElement("div"), sz = 14 + Math.random() * 46; b.className = "fen-bub";
            b.style.width = b.style.height = sz + "px"; b.style.left = Math.random() * 100 + "%";
            b.style.animationDuration = (7 + Math.random() * 8) + "s"; b.style.animationDelay = (-Math.random() * 12) + "s";
            c.appendChild(b);
          }
        });
      })();
    </script>

    <script>
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data",
        frameworkUrl: buildUrl + "/WebGL.framework.js",
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",

        // If you have a custom web site structure, or want to place multiple Unity build instances on the same page,
        // you can pass fullscreenElementID: "my-unity-fullscreen-container-id", in this configuration field to
        // explicitly point to the element tree root that is displayed in fullscreen mode.
        fullscreenElementID: "unity-fullscreen-container",

        companyName: "FenLab",
        productName: "FenLab",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas container in a window that can be maximized to fullscreen:
        fullscreenContainer.style.width = "960px";
        fullscreenContainer.style.height = "600px";
      }


      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%"; if (window.fenLoadPct) fenLoadPct(progress);
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((unityInstance) => {
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
      <script>
      if ('serviceWorker' in navigator) {
        // offline caching only for desktop / ChromeOS; phones and tablets always load online and drop any old cache
        var fenMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
        if (fenMobile) {
          navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
          if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
        } else {
          window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
        }
      }
    </script>
