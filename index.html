      <style id="fenlab-shell">

      .fen-link { background: none; border: 0; padding: 8px; font: 400 15px var(--fen-font); color: var(--fen-tx2); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

    <script id="fenlab-shell-js">
      /* fatal errors get a panel with a retry; warnings a short toast. Unity messages are shown as text, never as HTML. */
      window.fenShowError = function (msg) {
        var e = document.getElementById('fen-error'); if (!e) { alert(msg); return; }
        var d = document.getElementById('fen-err-d');
        if (msg) { d.textContent = String(msg); d.hidden = false; }
        var lc = document.getElementById('unity-loading-container'); if (lc) lc.style.display = 'none';
        e.classList.add('on'); document.getElementById('fen-err-retry').focus();
      };
      window.fenBanner = function (msg, type) {
        // Unity also reports non-fatal script errors here while the game keeps running, so these stay a toast;
        // only a failed start (the createUnityInstance catch) opens the error panel.
        var t = document.getElementById('fen-toast'); if (!t) return;
        var div = document.createElement('div'); div.textContent = String(msg).replace(/<[^>]*>/g, ''); t.appendChild(div);
        setTimeout(function () { div.remove(); }, type === 'error' ? 10000 : 6000);
      };
      window.addEventListener('DOMContentLoaded', function () {
        var r = document.getElementById('fen-err-retry'); if (r) r.onclick = function () { location.reload(); };
        var c = document.createElement('canvas');
        if (!(c.getContext('webgl2') || c.getContext('webgl'))) fenShowError('Bu tarayıcı ya da cihaz WebGL desteklemiyor.');
      });
    </script>
      <script type="module" id="fenlab-auth">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
      import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
      const auth = getAuth(initializeApp({ apiKey: "AIzaSyB6QqjuLW1gFZsKtAPVpiX9XAFQXponRE8", authDomain: "fen-lab-a58d7.firebaseapp.com", projectId: "fen-lab-a58d7", storageBucket: "fen-lab-a58d7.firebasestorage.app", messagingSenderId: "36295199033", appId: "1:36295199033:web:01f22d04702dae242cc0e8" }));
      window.__fenAuthResult = "";
      let lastFocus = null;
      function done(o) {
        window.__fenAuthResult = JSON.stringify(o);
        const d = document.getElementById('fen-auth-ov'); if (d) d.remove();
        document.removeEventListener('keydown', onKey, true);
        const t = document.getElementById('unity-canvas') || lastFocus; if (t && t.focus) t.focus();
      }
      function onKey(e) {
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done({ error: 'cancelled' }); return; }
        if (e.key === 'Tab') { // keep focus inside the dialog
          const f = Array.from(document.querySelectorAll('#fen-auth-ov button, #fen-auth-ov a')); if (!f.length) return;
          const i = f.indexOf(document.activeElement), n = e.shiftKey ? (i <= 0 ? f.length - 1 : i - 1) : (i + 1) % f.length;
          e.preventDefault(); f[n].focus();
        }
        e.stopPropagation(); // keys go to the dialog, not to the game behind it
      }
      window.fenAuthStart = function () {
        if (document.getElementById('fen-auth-ov')) return;
        lastFocus = document.activeElement;
        const d = document.createElement('div'); d.id = 'fen-auth-ov'; d.className = 'fen-overlay';
        d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true'); d.setAttribute('aria-labelledby', 'fen-auth-t');
        d.innerHTML = '<div class="fen-card"><h2 id="fen-auth-t">FenLab hesabı</h2><p>Google ile giriş yaparsan ilerlemen buluta kaydedilir, başka cihazda kaldığın yerden devam edersin.</p>'
          + '<div class="fen-row"><button class="fen-btn" id="fen-go" type="button">Google ile devam et</button><button class="fen-link" id="fen-no" type="button">Vazgeç</button></div>'
          + '<p class="fen-small"><a href="legal.html" target="_blank" rel="noopener">Gizlilik ve telif</a></p></div>';
        d.addEventListener('mousedown', (e) => { if (e.target === d) done({ error: 'cancelled' }); });
        document.body.appendChild(d);
        document.addEventListener('keydown', onKey, true);
        const go = document.getElementById('fen-go'); go.focus();
        document.getElementById('fen-no').onclick = () => done({ error: 'cancelled' });
        go.onclick = async () => {
          go.disabled = true; go.textContent = 'Google penceresi açık...';
          try { const r = await signInWithPopup(auth, new GoogleAuthProvider()); const u = r.user;
            done({ idToken: await u.getIdToken(), refreshToken: u.refreshToken, uid: u.uid, email: u.email || '', name: u.displayName || '' });
          } catch (e) { done({ error: e.code || String(e) }); }
        };
      };
    </script>

      <script id="fenlab-loader-js">
      (function () {
        var tips = ["Hata yapmaktan korkma, sonucunu gör.", "Kimya Laboratuvarı'nda arama çubuğuna beher ya da su yaz.", "Google ile giriş yaparsan ilerlemen buluta kaydedilir.", "Konu Anlatımı'nda sınav tarihlerini ve üniteleri filtreleyebilirsin.", "Soru çöz ve görev yap, XP ile avatarına yeni kıyafetler al.", "Tab tuşu fareyle etrafa bakmayı açıp kapatır.", "İlk açılış birkaç saniye sürebilir, sonraki açılışlar daha hızlıdır."];
        var tipEl, pctEl, bar, fill, ti = Math.floor(Math.random() * tips.length);
        function showTip() { if (!tipEl) return; tipEl.style.opacity = 0; setTimeout(function () { tipEl.textContent = tips[ti++ % tips.length]; tipEl.style.opacity = 1; }, 350); }
        window.fenLoadPct = function (p) {
          var n = Math.round(p * 100);
          if (pctEl) pctEl.textContent = "%" + n;
          if (bar) bar.setAttribute("aria-valuenow", n);
          if (fill) fill.style.setProperty("--fen-p", p);
        };
        window.addEventListener("DOMContentLoaded", function () {
          tipEl = document.getElementById("fen-load-tip"); pctEl = document.getElementById("fen-load-pct");
          bar = document.getElementById("unity-progress-bar-empty"); fill = document.getElementById("unity-progress-bar-full");
          showTip(); setInterval(showTip, 5500); // long enough to read a whole tip
        });
      })();
    </script>

    <script>
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data",
        frameworkUrl: buildUrl + "/WebGL.framework.js",
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",

        // If you have a custom web site structure, or want to place multiple Unity build instances on the same page,
        // you can pass fullscreenElementID: "my-unity-fullscreen-container-id", in this configuration field to
        // explicitly point to the element tree root that is displayed in fullscreen mode.
        fullscreenElementID: "unity-fullscreen-container",

        companyName: "FenLab",
        productName: "FenLab",
        productVersion: "1.0.5",
        showBanner: fenBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas container in a window that can be maximized to fullscreen:
        fullscreenContainer.style.width = "960px";
        fullscreenContainer.style.height = "600px";
      }


      config.devicePixelRatio = (function () { /* fenlab-dpr-cap2 */ var d = Math.min(window.devicePixelRatio || 1, 2), a = Math.max(1, window.innerWidth * window.innerHeight); if (a * d * d > 3.2e6) d = Math.sqrt(3.2e6 / a); return Math.max(0.6, d); })();
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%"; if (window.fenLoadPct) fenLoadPct(progress);
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((unityInstance) => {
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                fenShowError(message);
              });
            };

      document.body.appendChild(script);

    </script>
      <script>
      if ('serviceWorker' in navigator) {
        // offline caching only for desktop / ChromeOS; phones and tablets always load online and drop any old cache
        var fenMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
        if (fenMobile) {
          navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
          if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
        } else {
          window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
        }
      }
    </script>
